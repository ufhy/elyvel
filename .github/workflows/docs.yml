name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # lastUpdated needs full git history
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: Build docs
        run: bun run build
        working-directory: docs
      # Both of these call the Pages API, which 404s until Pages is enabled on the
      # repo — so the BUILD job failed on every push, not just the deploy. A
      # permanently red workflow trains you to ignore red ones, which is expensive
      # now that CI actually runs the tests. While Pages is off, this job just
      # validates that the docs build.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: ${{ !github.event.repository.private }}
      # This is what `actions/upload-pages-artifact` does internally, inlined.
      # That action calls `actions/upload-artifact@v4` — by tag — and this repo
      # requires every action to be pinned to a full-length SHA. The rule applies
      # transitively, so GitHub's own Pages action is rejected by GitHub's own
      # policy, and the build job died in "Set up job" before running a step. The
      # tar flags and the artifact name are the contract `deploy-pages` reads;
      # they are not arbitrary.
      - name: Package the site the way deploy-pages expects
        if: ${{ !github.event.repository.private }}
        run: |
          tar --dereference --hard-dereference \
            --exclude=.git --exclude=.github \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            -C docs/.vitepress/dist .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !github.event.repository.private }}
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # GitHub Pages needs a public repo (or a paid plan). While the repo is
    # private the build job still runs (validating the docs), but deploy is
    # skipped — no failed runs. It starts publishing automatically once the
    # repo is made public, with Settings → Pages → Source: GitHub Actions.
    if: ${{ !github.event.repository.private }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
