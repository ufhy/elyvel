name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # lastUpdated needs full git history
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: Build docs
        run: bun run build
        working-directory: docs
      # Both of these call the Pages API, which 404s until Pages is enabled on the
      # repo — so the BUILD job failed on every push, not just the deploy. A
      # permanently red workflow trains you to ignore red ones, which is expensive
      # now that CI actually runs the tests. While Pages is off, this job just
      # validates that the docs build.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: ${{ !github.event.repository.private }}
      # Back to the official action: v5.0.0 pins its own `actions/upload-artifact`
      # to a full-length SHA. v3 referenced it by tag, and since the pinning rule
      # applies to nested actions, GitHub's own Pages action was refused by
      # GitHub's own policy — the job died in "Set up job" and this step was
      # inlined by hand to get around it. Upstream fixed it; the workaround goes.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ !github.event.repository.private }}
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # GitHub Pages needs a public repo (or a paid plan). While the repo is
    # private the build job still runs (validating the docs), but deploy is
    # skipped — no failed runs. It starts publishing automatically once the
    # repo is made public, with Settings → Pages → Source: GitHub Actions.
    if: ${{ !github.event.repository.private }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          # 30 minutes instead of the default 10. Pages has taken longer than
          # that to publish, and the default doesn't just give up quietly — it
          # CANCELS the deployment, and the deployment id is the commit SHA, so
          # every retry on that commit is refused ("Deployment cancelled") and
          # only a new commit can publish. Waiting longer is far cheaper than
          # burning a SHA per attempt.
          timeout: 1800000
