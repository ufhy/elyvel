name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Full dialect coverage nightly, so a Postgres-only break can't sit unnoticed
  # between pushes to main.
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight run for the same ref. Saves Actions
# minutes, which are metered while this repo is private.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A real Postgres, not the WASM one. PGlite exists so the suite can cover
    # Postgres semantics with no server; on a machine that HAS a server it is
    # strictly worse — measured on the same 333 tests: pglite 136s, pg 12s. Real
    # Postgres is 11x faster and higher fidelity, so CI uses it and pglite is left
    # to the nightly run (it is a supported driver, so it still gets covered).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elyvel_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned rather than `latest`, so a Bun release can never turn every
          # open PR red on its own. Bump it deliberately, and see the
          # `bun-latest` job below for early warning about new Bun versions.
          bun-version: 1.3.12

      - run: bun install --frozen-lockfile

      # Cheapest first, so an obvious break fails in seconds rather than minutes.
      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # One `bun test` process per package. A single process for the whole repo
      # shares module state between packages, and the full-repo run fails 2 tests
      # on a 2-core machine and a DIFFERENT 2 on an 8-core one — same code, only
      # the interleaving changes. Every package passes on its own. See
      # scripts/test-all.ts.
      #
      # Dialects: sqlite plus the real Postgres above on every run, so pull
      # requests get full Postgres coverage instead of the sqlite-only compromise
      # that the WASM driver's cost used to force. The nightly run adds pglite,
      # which is a supported driver and so still needs covering — just not on the
      # critical path.
      - name: Test
        run: bun run test:all
        env:
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/elyvel_test
          TEST_DIALECTS: ${{ github.event_name == 'schedule' && 'sqlite,pg,pglite' || 'sqlite,pg' }}

      # The docs are part of the repo and a broken build is invisible until
      # deploy otherwise — `docs.yml` only builds on push to main, not on PRs.
      - name: Build docs
        run: bun run build
        working-directory: docs

      # Catches the release-blocking mistake this project has actually made:
      # a version bump without `bun install` leaves the lockfile stale, and the
      # packed tarballs then depend on versions that will never exist. Dry run —
      # publishes nothing.
      - name: Verify packages are publishable
        run: bun run release

  bun-latest:
    # Early warning that a new Bun release breaks us, WITHOUT gating merges on it.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun --version
      # Same per-package isolation as `check`, or this job reports the shared-state
      # interleaving as though a new Bun had broken something. sqlite only — this
      # job exists to catch Bun regressions, not to re-verify Postgres.
      - run: bun run test:all
        env:
          TEST_DIALECTS: sqlite
